[project]
name = "farol-ss"
version = "0.1.0"
description = "Farol da Saúde & Saneamento — monitor territorial de efetividade de gastos em saúde e vulnerabilidade sanitária"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.38",
    "folium>=0.17",
    "streamlit-folium>=0.22",
    "plotly>=5.24",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
sus = ["pysus>=0.15"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
farol = "farol_ss.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farol_ss"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Capturas amplas são intencionais em vários módulos:
# - spike.py: sondas não deveriam derrubar umas às outras
# - sinan.py, pncp.py: fonte fora do ar não derruba a ingestão
"src/farol_ss/ingest/spike.py" = ["BLE001"]
"src/farol_ss/ingest/sinan.py" = ["BLE001"]
"src/farol_ss/ingest/pncp.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
