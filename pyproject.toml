[project]
name = "farol-ss"
version = "0.1.0"
description = "Farol da Saúde & Saneamento — monitor territorial de efetividade de gastos em saúde e vulnerabilidade sanitária"
requires-python = ">=3.11"

# Base = runtime do painel Streamlit e da API. Mantido leve de propósito: é o
# que `requirements.txt` (deploy no Streamlit Cloud) instala via `-e .`.
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "numpy>=1.26,<3",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.38,<2",
    "folium>=0.17",
    "streamlit-folium>=0.22",
]

[project.optional-dependencies]
# Ingestão e CLI — só necessário para (re)rodar o pipeline, não para servir.
pipeline = ["httpx>=0.27", "tenacity>=9.0", "typer>=0.12", "rich>=13.7", "geopandas>=1.0"]
# API aberta FastAPI (`make api`). O painel não depende disto.
api = ["fastapi>=0.115", "uvicorn>=0.30"]
# Ingestão do SINAN via PySUS (pesado; só quem roda `farol ingest` precisa).
sus = ["pysus>=0.15"]
dev = ["pytest>=8.3", "ruff>=0.6", "farol-ss[pipeline,api,sus]"]

[project.scripts]
farol = "farol_ss.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farol_ss"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Capturas amplas são intencionais em vários módulos:
# - spike.py: sondas não deveriam derrubar umas às outras
# - sinan.py, pncp.py: fonte fora do ar não derruba a ingestão
"src/farol_ss/ingest/spike.py" = ["BLE001"]
"src/farol_ss/ingest/sinan.py" = ["BLE001"]
"src/farol_ss/ingest/pncp.py" = ["BLE001"]
# O Streamlit exige nomes de arquivo específicos: "Home.py" para o entrypoint
# e "N_Titulo.py" para cada página da navegação lateral. N999 não se aplica.
"src/farol_ss/app/Home.py" = ["N999"]
"src/farol_ss/app/pages/*.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
