# Configuração da busca de literatura para o trabalho do SIPES 2026.
# Os scripts 01–04 usam este arquivo. NADA aqui é o fichamento final: o
# fichamento analítico (resumo com suas palavras, citações diretas com página,
# paráfrases) é escrito por você depois de LER cada PDF.

email: protazoario@gmail.com   # exigido pelas APIs CrossRef/Unpaywall (contato)

# Periódicos Qualis A/B (Saúde Coletiva / Medicina II / Interdisciplinar,
# quadriênio 2017–2020) usados como filtro. ISSN eletrônico e impresso.
periodicos_qualis:
  - {nome: "Cadernos de Saúde Pública",                 issn: ["0102-311X", "1678-4464"], qualis: "A1"}
  - {nome: "Revista de Saúde Pública",                   issn: ["0034-8910", "1518-8787"], qualis: "A1"}
  - {nome: "Ciência & Saúde Coletiva",                   issn: ["1413-8123", "1678-4561"], qualis: "A1"}
  - {nome: "Revista Brasileira de Epidemiologia",        issn: ["1415-790X", "1980-5497"], qualis: "A2"}
  - {nome: "Epidemiologia e Serviços de Saúde",          issn: ["1679-4974", "2237-9622"], qualis: "A2"}
  - {nome: "Saúde e Sociedade",                          issn: ["0104-1290", "1984-0470"], qualis: "A2"}
  - {nome: "Physis: Revista de Saúde Coletiva",          issn: ["0103-7331", "1809-4481"], qualis: "A2"}
  - {nome: "Interface - Comunicação, Saúde, Educação",   issn: ["1414-3283", "1807-5762"], qualis: "A2"}
  - {nome: "Revista Panamericana de Salud Pública",      issn: ["1020-4989", "1680-5348"], qualis: "A1"}
  - {nome: "Revista de Administração Pública",           issn: ["0034-7612", "1982-3134"], qualis: "A2"}
  - {nome: "The Lancet",                                 issn: ["0140-6736", "1474-547X"], qualis: "A1"}
  - {nome: "BMJ Global Health",                          issn: ["2059-7908"],              qualis: "A1"}
  - {nome: "Health Policy and Planning",                 issn: ["0268-1080", "1460-2237"], qualis: "A1"}
  - {nome: "BMC Public Health",                          issn: ["1471-2458"],              qualis: "A2"}
  - {nome: "Bulletin of the World Health Organization",  issn: ["0042-9686", "1564-0604"], qualis: "A1"}
  - {nome: "Government Information Quarterly",            issn: ["0740-624X"],              qualis: "A1"}

# Buscas por tema (o script consulta o CrossRef restringindo aos ISSN acima).
# Alvo: >= 20 aceitos; teto LIMITE=24 no script. Ajuste termos/anos/n se preciso.
buscas:
  - {tema: "equidade e alocação de recursos no SUS",
     query: "equidade alocação de recursos saúde SUS", de: 2005, ate: 2025, n: 3}
  - {tema: "financiamento e gasto público em saúde",
     query: "financiamento gasto público saúde municípios Brasil per capita", de: 2005, ate: 2025, n: 2}
  - {tema: "iniquidades territoriais em saúde",
     query: "desigualdades regionais iniquidades territoriais saúde Brasil", de: 2008, ate: 2025, n: 2}
  - {tema: "saneamento e saúde / DRSAI",
     query: "saneamento básico internações doenças diarreicas veiculação hídrica", de: 2005, ate: 2025, n: 3}
  - {tema: "saneamento e morbidade infantil",
     query: "esgotamento sanitário abastecimento de água morbidade hospitalização crianças", de: 2005, ate: 2025, n: 2}
  - {tema: "sistemas de informação em saúde - qualidade do dado",
     query: "qualidade completitude dados sistemas de informação em saúde SINAN SIH", de: 2005, ate: 2025, n: 3}
  - {tema: "vigilância de arboviroses",
     query: "vigilância dengue chikungunya zika notificação municípios", de: 2015, ate: 2025, n: 2}
  - {tema: "dados abertos governamentais e transparência",
     query: "dados abertos governamentais transparência controle social", de: 2012, ate: 2025, n: 2}
  - {tema: "indicadores compostos e análise espacial em saúde",
     query: "indicador composto análise espacial saúde municípios unidade de agregação", de: 2005, ate: 2025, n: 2}
  - {tema: "preços e compras públicas de medicamentos/insumos",
     query: "preços medicamentos compras públicas aquisição insumos saúde", de: 2008, ate: 2025, n: 2}

